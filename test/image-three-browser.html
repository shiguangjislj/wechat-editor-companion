<!doctype html><html><meta charset="utf-8"><body>
<article contenteditable="true"><p>测试文章内容</p>
<p><img src="https://example.com/one.jpg" width="100" height="60"></p>
<p><img src="https://example.com/two.jpg" width="100" height="60"></p>
<p><img src="https://example.com/three.jpg" width="100" height="60"></p>
</article><pre id="result">pending</pre>
<script src="../src/editor-adapter.js"></script>
<script>
window.addEventListener('load', async () => {
  const editor = document.querySelector('article');
  const selected = [...editor.querySelectorAll('img')];
  const progress = [];
  const result = await window.WXHAdapter.applyImageStyleBatch(editor, selected,
    {radius:12,shadow:'soft',border:'light',align:'center'},
    (done, total) => progress.push(`${done}/${total}`));
  const appliedVisible = result.reconcile?.().visibleCount;
  const undo = result.ok ? await result.snapshot.restore() : null;
  document.querySelector('#result').textContent = JSON.stringify({
    ok:result.ok,reason:result.reason||'',changed:result.changed,
    appliedVisible,undoOk:undo?.ok,undoReason:undo?.reason||'',undone:undo?.restored,
    remainingFrames:editor.querySelectorAll('[data-wxh-image-frame]').length,progress
  });
});
</script></body></html>
